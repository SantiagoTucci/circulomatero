name = "circulomatero"
main = "cloudflare-worker/index.ts"
compatibility_date = "2024-01-01"

# 🛠️ Configuración de Assets Estáticos (Valor corregido)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

# KV namespace para caché de productos
[[kv_namespaces]]
binding = "PRODUCTS_CACHE"
id = "7584972c60ec48069b96c8a65ad31da3"

# Cron Trigger para actualizar caché cada 10 minutos
[triggers]
crons = ["*/10 * * * *"]

# Variables de entorno
[vars]
SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4RhFNa0snHZSD8lSJVpAs9hL6H52fKzcy7xMsrVX9ZJygwwYtSyzWK4rRbYCEjghbPXVzsZICcF0K/pub?output=csv"